name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package*.json"
      - "book.json"
      # The CLI and the patch scripts decide what the image can actually do,
      # so a change to either must run the smoke test before :latest ships
      - "gitbook-cli/**"
      - "scripts/**"
      - ".github/workflows/docker-image.yml"

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-and-test:
    name: Build and smoke-test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: tamir-gitbook-wiki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — serve the book and fetch the index page
        run: |
          docker run -d --name ci-smoke -p 4000:4000 tamir-gitbook-wiki:ci
          # gitbook serve rebuilds the book on startup; poll until it answers
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1; then
              echo "GitBook is serving after ~$((i * 5))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::GitBook never came up"
              docker logs ci-smoke
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://localhost:4000/ | grep -qi "Tamir GitBook Wiki"
          # Browser-style conditional requests crashed the server before the
          # send/_headers patch — verify real HTTP caching semantics and that
          # the process survives them
          etag=$(curl -fsSI http://localhost:4000/ | awk -F': ' 'tolower($1)=="etag"{print $2}' | tr -d '\r')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" http://localhost:4000/)
          [ "$code" = "304" ] || { echo "::error::expected 304 on matching etag, got $code"; exit 1; }
          curl -fsS -H 'If-Modified-Since: Mon, 01 Jan 2024 00:00:00 GMT' http://localhost:4000/ >/dev/null
          curl -fsS http://localhost:4000/ >/dev/null   # server still alive
          # Exercise the patched engine paths: static build and the plugin
          # installer (npmi + the swapped-in npm 6 tree)
          docker exec ci-smoke sh -c "cd /gitbook && gitbook build >/dev/null"
          docker exec ci-smoke sh -c "cd /gitbook && gitbook install >/dev/null"
          docker rm -f ci-smoke
