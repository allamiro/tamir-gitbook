name: Build & Publish (Docker Hub + GHCR)

# Publishes multi-arch images to GHCR always (needs only the built-in
# GITHUB_TOKEN) and additionally to Docker Hub when DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets are configured. Missing Docker Hub secrets produce
# a warning, not a failure.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  # Each platform builds natively (no QEMU emulation). Non-PR builds push by
  # digest; the merge job stitches the digests into one multi-arch manifest
  # list per registry and applies the tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v7

      - name: Determine destination registries
        id: dst
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ghcr="ghcr.io/${{ github.repository_owner }}/tamir-gitbook-wiki"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            {
              echo "has_dockerhub=true"
              echo "dockerhub_image=docker.io/${DOCKERHUB_USERNAME}/tamir-gitbook-wiki"
              echo "push_names=docker.io/${DOCKERHUB_USERNAME}/tamir-gitbook-wiki,${ghcr}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured — publishing to GHCR only"
            {
              echo "has_dockerhub=false"
              echo "dockerhub_image="
              echo "push_names=${ghcr}"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # dockerhub_image is empty when Docker Hub secrets are absent
          # (empty lines are ignored by metadata-action)
          images: |
            ${{ steps.dst.outputs.dockerhub_image }}
            ghcr.io/${{ github.repository_owner }}/tamir-gitbook-wiki

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.dst.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.dst.outputs.push_names }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write         # keyless cosign signing via GitHub OIDC
      security-events: write  # Trivy SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@v7   # for .trivyignore

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Determine destination registries
        id: dst
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ghcr="ghcr.io/${{ github.repository_owner }}/tamir-gitbook-wiki"
          echo "short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            {
              echo "has_dockerhub=true"
              echo "dockerhub_image=docker.io/${DOCKERHUB_USERNAME}/tamir-gitbook-wiki"
              echo "images=docker.io/${DOCKERHUB_USERNAME}/tamir-gitbook-wiki ${ghcr}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_dockerhub=false"
              echo "dockerhub_image="
              echo "images=${ghcr}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.dst.outputs.dockerhub_image }}
            ghcr.io/${{ github.repository_owner }}/tamir-gitbook-wiki
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to Docker Hub
        if: steps.dst.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in ${{ steps.dst.outputs.images }}; do
            tags=$(jq -cr --arg img "$image" \
              '.tags | map(select(startswith($img + ":")) | "-t " + .) | join(" ")' \
              <<< "$DOCKER_METADATA_OUTPUT_JSON")
            # $tags and the digest list are intentionally word-split
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "${image}@sha256:%s " *)
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published manifests (keyless OIDC)
        run: |
          tag="sha-${{ steps.dst.outputs.short_sha }}"
          for image in ${{ steps.dst.outputs.images }}; do
            digest=$(docker buildx imagetools inspect "${image}:${tag}" \
              --format '{{.Manifest.Digest}}')
            cosign sign --yes "${image}@${digest}"
          done

      - name: Scan published image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/tamir-gitbook-wiki:sha-${{ steps.dst.outputs.short_sha }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          timeout: 10m
          trivyignores: .trivyignore
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy results to the GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
