name: Tests

# Fast checks that run on every PR and push to main: workflow lint,
# Markdown lint, link check, and compose file validation. The Docker image
# itself is linted, built, and smoke-tested by the CI workflow.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          flags: "-ignore SC2046 -ignore SC2086"

  markdown-lint:
    name: Lint Markdown content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !_book
            !gitbook-cli

  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,429
            --exclude localhost
            --exclude 127.0.0.1
            --exclude token.actions.githubusercontent.com
            --exclude-path _book
            --exclude-path node_modules
            --exclude-path gitbook-cli
            './**/*.md'
          fail: true

  cli-unit-tests:
    name: Vendored gitbook-cli tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 10 = oldest supported; 22/24 = LTS lines; 26 = Current, so breakage
        # in the next LTS shows up before it matters
        node: ["10.24.1-alpine3.11", "22-alpine", "24-alpine", "26-alpine"]
    steps:
      - uses: actions/checkout@v7
      # Not a `container:` job: the Actions runner injects its own modern
      # node binary into job containers, which cannot start on Alpine 3.11's
      # old musl. Running the Node image via docker run avoids that.
      # Modern-Node entries prove the CLI itself (not the legacy GitBook
      # engine) works on current Node — see the modernization epic (#10).
      - name: Unit tests + ls-remote smoke (Node ${{ matrix.node }})
        run: |
          # `ls-remote | head -5` used to hide the exit status behind head's,
          # so this check could not fail. Capture the output and assert on it.
          docker run --rm -v "$PWD/gitbook-cli":/cli-src "node:${{ matrix.node }}" sh -c \
            "set -e
             apk add --no-cache git >/dev/null 2>&1
             cp -r /cli-src /cli && cd /cli
             npm install --no-audit --no-fund --loglevel=error 2>/dev/null || npm install --loglevel=error
             npm run test:unit
             out=\$(node bin/gitbook.js ls-remote)
             echo \"\$out\" | head -5
             echo \"\$out\" | grep -q '3.2.3' || { echo 'ls-remote did not list the engine version'; exit 1; }"

  cli-windows:
    name: Vendored gitbook-cli on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Windows is where npm is launched as npm.cmd, which modern Node refuses
      # to execFile — the CLI resolves npm's JS entry point instead. Without a
      # Windows leg that fix is untestable, and the breakage was invisible.
      - name: Unit tests
        working-directory: gitbook-cli
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm test
      - name: Install the CLI and drive a real book
        shell: pwsh
        run: |
          $tgz = (npm pack ./gitbook-cli --silent | Select-Object -Last 1).Trim()
          npm install -g $tgz --loglevel=error
          gitbook fetch 3.2.3
          New-Item -ItemType Directory -Force -Path book | Out-Null
          Set-Content book/README.md "# Windows check"
          Set-Content book/SUMMARY.md "# Summary`n`n* [Intro](README.md)"
          Set-Content book/book.json '{ "plugins": ["anchors"] }'
          cd book
          gitbook install
          gitbook build
          if (-not (Test-Path _book/index.html)) { throw "build produced no output" }
          Write-Host "Windows: fetch, plugin install and build all succeeded"

  license-boundary:
    name: Open-core license boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the Apache-2.0 / Enterprise Edition boundary
        run: sh scripts/check-license-boundary.sh

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
