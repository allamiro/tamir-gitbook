name: Auto-tag

# Cuts a release that GROUPS all changes merged since the previous tag —
# weekly on a schedule, or on demand via workflow_dispatch (Actions →
# Auto-tag → Run workflow). Individual merges to main do NOT each create a
# release; they still publish rolling latest/main/sha-* images via
# docker-publish.yml.
#
# Bump rules (conventional commits, highest wins across the batch):
#   BREAKING CHANGE: footer    →  major  (v1.0.0 → v2.0.0)
#   feat:                      →  minor  (v1.0.0 → v1.1.0)
#   fix: / perf: / refactor:   →  patch  (v1.0.0 → v1.0.1)
#   anything else              →  patch  (default)
#
# If nothing was merged since the last tag, the run is a no-op.

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch: {}

jobs:
  tag:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write   # to dispatch the publish workflow for the new tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed to find previous tag

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Pack gitbook-cli release tarball
        if: steps.tag.outputs.new_tag != ''
        run: |
          npm pack ./gitbook-cli
          mv gitbook-cli-*.tgz "gitbook-cli-${{ steps.tag.outputs.new_tag }}.tgz"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          make_latest: true
          files: gitbook-cli-*.tgz

      - name: Trigger versioned image publish
        # Tags pushed with GITHUB_TOKEN do not fire the publish workflow's
        # tag trigger (workflow-generated events don't cascade), so dispatch
        # it explicitly on the new tag ref to publish the x.y.z image tags.
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "${{ steps.tag.outputs.new_tag }}"

      - name: Summary
        run: |
          echo "Previous version : ${{ steps.tag.outputs.previous_tag }}"
          echo "New version      : ${{ steps.tag.outputs.new_tag }}"
          echo "Changelog        :"
          echo "${{ steps.tag.outputs.changelog }}"
