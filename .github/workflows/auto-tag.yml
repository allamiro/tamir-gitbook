name: Auto-tag

# Runs after every push to main that changes actual code or config.
# Pure documentation changes (README, LICENSE, book content) are excluded
# so they don't generate a new image version.
#
# Bump rules (conventional commits):
#   feat!: / BREAKING CHANGE  →  major  (v1.0.0 → v2.0.0)
#   feat:                      →  minor  (v1.0.0 → v1.1.0)
#   fix: / perf: / refactor:   →  patch  (v1.0.0 → v1.0.1)
#   anything else              →  patch  (default)
#
# The new tag triggers docker-publish.yml (versioned image push to Docker Hub
# + GHCR), and a GitHub Release with generated notes is created here.

on:
  push:
    branches: ["main"]
    # Repo docs and meta files don't ship in the image — no release for them.
    # Book content (SUMMARY.md, chapter-*/) IS baked into the image, so it
    # intentionally stays release-triggering.
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".markdownlint.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

jobs:
  tag:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write   # to dispatch the publish workflow for the new tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed to find previous tag

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          make_latest: true

      - name: Trigger versioned image publish
        # Tags pushed with GITHUB_TOKEN do not fire the publish workflow's
        # tag trigger (workflow-generated events don't cascade), so dispatch
        # it explicitly on the new tag ref to publish the x.y.z image tags.
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "${{ steps.tag.outputs.new_tag }}"

      - name: Summary
        run: |
          echo "Previous version : ${{ steps.tag.outputs.previous_tag }}"
          echo "New version      : ${{ steps.tag.outputs.new_tag }}"
          echo "Changelog        :"
          echo "${{ steps.tag.outputs.changelog }}"
