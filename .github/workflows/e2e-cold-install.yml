name: E2E (cold install)

# Installs the *published* CLI release on a clean machine and drives a real
# book through it: fetch the engine from the npm registry, install plugins,
# build, serve, and revalidate a cached response. Nothing from the working
# tree is used, so this catches drift the image build hides — a broken
# release asset, npm or registry behaviour changes, plugin metadata changes,
# or a new Node release breaking the legacy engine.

on:
  schedule:
    - cron: "30 6 * * 2"  # Every Tuesday at 06:30 UTC
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "gitbook-cli/**"
      - "scripts/e2e-cold-install.sh"
      - ".github/workflows/e2e-cold-install.yml"

jobs:
  cold-install:
    name: Released CLI on clean Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22-alpine", "24-alpine", "26-alpine"]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # On a push we must test the code that was just pushed: resolving the
      # latest *release* would exercise the tarball that predates the change
      # and hand back a green tick for code nothing ran.
      - name: Pack the working tree (push events)
        id: worktree
        if: github.event_name == 'push'
        run: |
          tgz=$(cd gitbook-cli && npm pack --loglevel=error | tail -1)
          mv "gitbook-cli/$tgz" "$PWD/$tgz"
          { echo "tag=working tree ($GITHUB_SHA)"; echo "url=$PWD/$tgz"; } >> "$GITHUB_OUTPUT"

      - name: Resolve the latest release's CLI tarball (schedule / manual)
        id: published
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[] | select(.name | endswith(".tgz")) | .url' | head -1)
          if [ -z "$url" ]; then
            echo "::error::release $tag has no gitbook-cli tarball attached"
            exit 1
          fi
          echo "Testing $tag: $url"
          { echo "tag=$tag"; echo "url=$url"; } >> "$GITHUB_OUTPUT"

      - name: Select which tarball to drive
        id: release
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            { echo "tag=${{ steps.worktree.outputs.tag }}"
              echo "url=${{ steps.worktree.outputs.url }}"; } >> "$GITHUB_OUTPUT"
          else
            { echo "tag=${{ steps.published.outputs.tag }}"
              echo "url=${{ steps.published.outputs.url }}"; } >> "$GITHUB_OUTPUT"
          fi

      # Run inside the Node image rather than a `container:` job — the runner
      # injects its own node binary into job containers, which fails on the
      # older musl in some of these images.
      - name: Cold install, build, serve and revalidate
        run: |
          # A working-tree tarball lives on disk, so mount the repo too
          docker run --rm \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD:/repo:ro" \
            "node:${{ matrix.node }}" \
            sh /scripts/e2e-cold-install.sh \
              "$(echo '${{ steps.release.outputs.url }}' | sed "s|^$PWD|/repo|")"

      - name: Summary
        if: always()
        run: |
          {
            echo "Release : ${{ steps.release.outputs.tag }}"
            echo "Node    : ${{ matrix.node }}"
            echo "Result  : ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
