version: 2
updates:
  # Keep GitHub Actions up to date. The root npm project and the Docker base
  # image are intentionally NOT tracked: the legacy GitBook stack requires the
  # pinned Node 10 base and frozen plugin versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # Vendored, maintained gitbook-cli: accept dependency updates that stay
  # compatible with Node 10 and the CLI's programmatic npm usage.
  - package-ecosystem: npm
    directory: /gitbook-cli
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      # npm >= 8 removed the programmatic API the CLI depends on, and modern
      # npm requires Node 20+. Tracked in the modernization epic (#10).
      - dependency-name: npm
      - dependency-name: npmi
      # Major versions of anything in this tree generally require Node > 10
      # (e.g. commander 15 fails to even parse). Only propose minor/patch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
