version: 2
updates:
  # Keep GitHub Actions up to date. The root npm project and the Docker base
  # image are intentionally NOT tracked: the root project pins the GitBook
  # plugin versions the sample book is built against, and the base image is
  # moved deliberately with the Node LTS cycle.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # Vendored, maintained gitbook-cli: accept dependency updates that stay
  # compatible with the oldest supported runtime (Node 10.12).
  - package-ecosystem: npm
    directory: /gitbook-cli
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      # Major versions in this tree generally require Node > 10 (commander 15,
      # for example, fails to even parse there), and the CLI still supports
      # Node 10.12. Only propose minor/patch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
