# Markdown lint rules for book content and repo docs.
# Lenient on style, strict on correctness.
default: true
MD013: false        # line length — prose lines are not wrapped
MD024:
  siblings_only: true
MD033: false        # inline HTML is fine in GitBook content
MD034: false        # bare URLs are acceptable in docs
MD036: false        # emphasis-as-heading used in book content
MD041: false        # first line does not have to be a top-level heading
