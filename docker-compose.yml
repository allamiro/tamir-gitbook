services:
  gitbook:
    build: .
    image: allamiro1/tamir-gitbook-wiki:latest
    ports:
      - "4000:4000"
      - "35729:35729"  # LiveReload port for better development experience
    volumes:
      - .:/gitbook
      - node_modules:/gitbook/node_modules  # Persist node_modules to avoid reinstalling packages
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    command: gitbook serve

volumes:
  node_modules:  # Named volume for node_modules
